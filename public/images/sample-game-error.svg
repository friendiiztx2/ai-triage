<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <!-- Game Screen Dark Background -->
  <rect width="500" height="350" rx="16" fill="#0f172a"/>
  
  <!-- Dimmed slot machine graphic in background -->
  <rect x="50" y="40" width="400" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="120" cy="140" r="35" fill="#f59e0b" opacity="0.3"/>
  <circle cx="250" cy="140" r="35" fill="#ef4444" opacity="0.3"/>
  <circle cx="380" cy="140" r="35" fill="#10b981" opacity="0.3"/>
  
  <!-- Overlay Dark Backdrop -->
  <rect width="500" height="350" rx="16" fill="#000000" opacity="0.75"/>
  
  <!-- Dialog Modal Box -->
  <rect x="75" y="65" width="350" height="220" rx="16" fill="#1e1e24" stroke="#e11d48" stroke-width="2"/>
  
  <!-- Warning Icon -->
  <circle cx="250" cy="115" r="26" fill="#ffe4e6"/>
  <path d="M 250 102 L 250 120 M 250 128 L 250 130" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round"/>
  
  <text x="250" y="165" font-family="'Segoe UI', Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">การเชื่อมต่อเกมขัดข้อง</text>
  <text x="250" y="190" font-family="'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">หลุดจากการเชื่อมต่อไปยังเซิร์ฟเวอร์เกมมิ่ง (Error Code: 8802)</text>
  <text x="250" y="210" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">กรุณาแคปภาพหน้าจอนี้แจ้งฝ่ายบริการลูกค้า</text>
  
  <!-- Button -->
  <rect x="175" y="235" width="150" height="36" rx="8" fill="#e11d48"/>
  <text x="250" y="258" font-family="'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ตกลง / ออกจากเกม</text>
</svg>
