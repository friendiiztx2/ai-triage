<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <rect width="600" height="380" fill="#f8fafc"/>
  
  <!-- Browser top bar mockup -->
  <rect width="600" height="40" fill="#e2e8f0"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="38" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="6" fill="#10b981"/>
  <rect x="80" y="8" width="440" height="24" rx="6" fill="#ffffff"/>
  <text x="95" y="24" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" fill="#64748b">https://game.siftai.com/login</text>
  
  <!-- Cloudflare / Web 502 graphic -->
  <text x="50" y="100" font-family="'Segoe UI', Tahoma, sans-serif" font-size="28" font-weight="900" fill="#1e293b">502 Bad Gateway</text>
  <text x="50" y="130" font-family="'Segoe UI', Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#e11d48">Host Error - Server is unreachable</text>
  
  <line x1="50" y1="150" x2="550" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Three nodes: Browser, Cloudflare, Host -->
  <!-- 1. Browser (OK) -->
  <circle cx="100" cy="220" r="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="100" y="225" font-family="'Segoe UI', Tahoma, sans-serif" font-size="18" fill="#10b981" text-anchor="middle">💻</text>
  <text x="100" y="270" font-family="'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">You</text>
  <text x="100" y="288" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">Browser: Working</text>
  
  <!-- Connector 1 -->
  <line x1="140" y1="220" x2="260" y2="220" stroke="#10b981" stroke-width="3"/>
  
  <!-- 2. Cloudflare (OK) -->
  <circle cx="300" cy="220" r="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="300" y="225" font-family="'Segoe UI', Tahoma, sans-serif" font-size="18" fill="#10b981" text-anchor="middle">☁️</text>
  <text x="300" y="270" font-family="'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Bangkok</text>
  <text x="300" y="288" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">Cloudflare: Working</text>
  
  <!-- Connector 2 (Broken) -->
  <line x1="340" y1="220" x2="460" y2="220" stroke="#e11d48" stroke-width="3" stroke-dasharray="6 6"/>
  
  <!-- 3. Host (Error) -->
  <circle cx="500" cy="220" r="30" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="500" y="225" font-family="'Segoe UI', Tahoma, sans-serif" font-size="18" fill="#e11d48" text-anchor="middle">❌</text>
  <text x="500" y="270" font-family="'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">siftai.com</text>
  <text x="500" y="288" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#e11d48" text-anchor="middle">Host: Error</text>
  
  <text x="300" y="340" font-family="'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Cloudflare Ray ID: 8a4c99e120f • Your IP: 180.180.xxx.xxx</text>
</svg>
